server {
    listen 80;
    listen [::]:80;
    server_name browsers.draxgr.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 200 "browsertools deployment bootstrap\n";
        add_header Content-Type text/plain;
    }
}
