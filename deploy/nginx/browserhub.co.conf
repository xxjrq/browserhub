# BrowserHub production site: browserhub.co
# Install at /etc/nginx/sites-available/browserhub.co and enable with a symlink.

server {
    listen 80;
    listen [::]:80;
    server_name browserhub.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://browserhub.co$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name browserhub.co;

    ssl_certificate /etc/letsencrypt/live/browserhub.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/browserhub.co/privkey.pem;

    root /opt/browsertools/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# Keep the Chinese locale as the canonical default entry point.
	location = / {
		return 301 /zh-cn/;
	}

	location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
